<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <filter id="hex-monogram-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.22" />
    </filter>
    <clipPath id="hex-monogram-clip">
      <path d="M 164 24 L 348 24 C 452 24, 488 60, 488 164 L 488 348 C 488 452, 452 488, 348 488 L 164 488 C 60 488, 24 452, 24 348 L 24 164 C 24 60, 60 24, 164 24 Z" />
    </clipPath>
    <linearGradient id="hex-monogram-bg" x1="256" y1="24" x2="256" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F3F5F9" />
      <stop offset="100%" stop-color="#E3E7F0" />
    </linearGradient>
    <linearGradient id="hex-monogram-rim" x1="256" y1="24" x2="256" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="22%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="85%" stop-color="#94A3B8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.32" />
    </linearGradient>
    <linearGradient id="hex-monogram-ink" x1="256" y1="157" x2="256" y2="357" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D3442" />
      <stop offset="100%" stop-color="#151921" />
    </linearGradient>
    <linearGradient id="hex-monogram-accent" x1="152" y1="220" x2="200" y2="294" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#47A8FF" />
      <stop offset="100%" stop-color="#005FD1" />
    </linearGradient>
    <filter id="hex-monogram-glyph-shadow" x="-25%" y="-30%" width="150%" height="165%">
      <feDropShadow dx="0" dy="4.5" stdDeviation="4.5" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- ベース角丸四角形（連続曲率） -->
  <g filter="url(#hex-monogram-shadow)">
    <path d="M 164 24 L 348 24 C 452 24, 488 60, 488 164 L 488 348 C 488 452, 452 488, 348 488 L 164 488 C 60 488, 24 452, 24 348 L 24 164 C 24 60, 60 24, 164 24 Z" fill="url(#hex-monogram-bg)" />
    <g clip-path="url(#hex-monogram-clip)">
      <path d="M 164 24 L 348 24 C 452 24, 488 60, 488 164 L 488 348 C 488 452, 452 488, 348 488 L 164 488 C 60 488, 24 452, 24 348 L 24 164 C 24 60, 60 24, 164 24 Z" fill="none" stroke="url(#hex-monogram-rim)" stroke-width="5.5" />
    </g>
  </g>

  <!-- 幾何学パスによる「0x」モノグラム -->
  <g filter="url(#hex-monogram-glyph-shadow)">
    <!-- 数字の 0（スタジアム型ジオメトリ） -->
    <rect x="128" y="177" width="94" height="158" rx="47" stroke="url(#hex-monogram-ink)" stroke-width="36" />
    <!-- 0 の中央アクセントスラッシュ -->
    <path d="M 156 285 L 194 227" stroke="url(#hex-monogram-accent)" stroke-width="25" stroke-linecap="round" />
    <!-- 小文字の x（ベースライン揃え・均整パス） -->
    <path d="M 299 234 L 384 335 M 384 234 L 299 335" stroke="url(#hex-monogram-ink)" stroke-width="36" stroke-linecap="round" />
  </g>
</svg>